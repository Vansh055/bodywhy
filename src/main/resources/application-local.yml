server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bodywhy
    username: bodywhy
    password: bodywhy

  ai:
    model:
      chat: openai
      embedding: ollama

    openai:
      api-key: ${GROQ_API_KEY}


      # IMPORTANT: Groq OpenAI-compatible endpoint
      base-url: https://api.groq.com/openai/v1

      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.2

    ollama:
      base-url: http://localhost:11434

      embedding:
        options:
          model: nomic-embed-text

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768

logging:
  level:
    com.bodywhy: DEBUG
    org.springframework.security: TRACE